[package]
edition = "2021"
name = "napi-ffi"
version = "0.0.100"

[lib]
crate-type = ["cdylib"]

[workspace]
members = []

[dependencies]
libffi = "5.1.0"
napi-derive = "3.5.6"

[dependencies.napi]
version = "3.9.0"
default-features = false
# see https://nodejs.org/api/n-api.html#node-api-version-matrix
features = ["napi6"]

[build-dependencies]
napi-build = "2.3.2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
